  <text x="405" y="301" class="s" fill="#fff" stroke="#171717" stroke-width="1.5" paint-order="stroke" font-size="15.5" font-weight="900">At <tspan fill="#f1b72c" stroke="#f1b72c" stroke-width="1.6">TRINITY UMC</tspan> in <tspan fill="#f1b72c" stroke="#f1b72c" stroke-width="1.6">DOWNTOWN DURHAM, NC</tspan></text>

  <rect x="22" y="337" width="772" height="249" fill="#111719"/>
  <text x="48" y="369" class="s" fill="#fff" font-size="16.7" font-weight="600">
   <tspan x="48" dy="0">The First Step Beginners AA Group holds a meeting at Trinity UMC in Downtown</tspan>
   <tspan x="48" dy="24">Durham, NC. We are unaffiliated with, but intentionally located near The Open</tspan>
   <tspan x="48" dy="24">Table Ministry’s Free Store and Resource Weekly Event. This was purposely done,</tspan>
   <tspan x="48" dy="24">as we hope to also be welcoming and accessible to the population that frequents</tspan>
   <tspan x="48" dy="24">the Open Table, a population that is often experiencing Housing Insecurity and</tspan>
   <tspan x="48" dy="24">Homelessness.</tspan>
   <tspan x="48" dy="33">The First Step Beginners AA Group will discuss the first four steps with each</tspan>
   <tspan x="48" dy="24">topic being anchored in official AA literature.</tspan>
  </text>

