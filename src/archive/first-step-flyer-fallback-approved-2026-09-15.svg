  <text x="511" y="737" class="s" fill="#111" font-size="13.2" font-weight="700">215 N. Church St.</text>
  <text x="458" y="767" class="s" fill="#111" font-size="13.2" font-weight="600">Follow the sign marked “ACCESS RAMP,”</text>
  <text x="458" y="789" class="s" fill="#111" font-size="13.2" font-weight="600">then continue up the long ramp to the</text>
  <text x="458" y="811" class="s" fill="#111" font-size="13.2" font-weight="600">entrance door at the top.</text>

