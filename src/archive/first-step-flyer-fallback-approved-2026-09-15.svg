  <text x="410" y="267" class="s" fill="#f1b72c" stroke="#171717" stroke-width="3" paint-order="stroke" font-size="37" font-weight="900">TUESDAYS 11am</text>
  <text x="410" y="301" class="s" fill="#fff" stroke="#171717" stroke-width="2" paint-order="stroke" font-size="14.5" font-weight="800">At <tspan fill="#f1b72c">TRINITY UMC</tspan> in <tspan fill="#f1b72c">DOWNTOWN DURHAM, NC</tspan></text>

  <rect x="22" y="337" width="772" height="249" fill="#111719"/>
  <text x="48" y="378" class="s" fill="#fff" font-size="15.5" font-weight="600">
   <tspan x="48" dy="0">The First Step Beginners AA Group holds a meeting at Trinity UMC in Downtown</tspan>
   <tspan x="48" dy="22">Durham, NC. We are unaffiliated with, but intentionally located near The Open</tspan>
   <tspan x="48" dy="22">Table Ministry’s Free Store and Resource Weekly Event. This was done purposely,</tspan>
   <tspan x="48" dy="22">as we hope to also be welcoming and accessible to the population that frequents</tspan>
   <tspan x="48" dy="22">the Open Table, a population that is often experiencing Housing Insecurity and</tspan>
   <tspan x="48" dy="22">Homelessness.</tspan>
   <tspan x="48" dy="32">The First Step Beginners AA Group will discuss the first four steps with each</tspan>
   <tspan x="48" dy="22">topic being anchored in official AA literature.</tspan>
  </text>

